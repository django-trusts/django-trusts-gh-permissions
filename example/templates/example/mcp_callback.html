<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if code %}Authorization code ignored{% elif error %}Authorization cancelled{% else %}No access was granted{% endif %}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
    main { max-width: 36rem; margin: 4rem auto; background: #fff; padding: 1.5rem; border: 1px solid #d0d7de; }
  </style>
</head>
<body>
  <main>
    {% if code %}
      <h1>Authorization code ignored</h1>
      <p>This page does not exchange an authorization code or issue a credential.</p>
    {% elif error %}
      <h1>Authorization cancelled</h1>
      <p>No access was granted.</p>
    {% else %}
      <h1>No access was granted</h1>
    {% endif %}
  </main>
</body>
</html>
