name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  # Paired core handle.register + symbolic condition API (django-trusts#211).
  COMPANION_KERNEL_SHA: 8bfe6151b5a65af2d0667ab3a71680eecc90a691

jobs:
  tests:
    name: tests vs final core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Guard against Zero
      run: |
        test ! -e trusts/zero
        ! grep -R --include='*.py' -n 'from trusts\.zero\|import trusts\.zero\|django-trusts-zero' gh_permissions
    - name: Install final core then GH
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
    - name: Pin guard
      run: |
        python - <<'PY'
        from pathlib import Path
        pin = Path('scripts/django-trusts.pin').read_text()
        assert '8bfe6151b5a65af2d0667ab3a71680eecc90a691' in pin, pin
        PY
        python -c "import django; assert django.VERSION[:2] == (6, 1), django.VERSION"
    - name: Tests
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Fresh migrate
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings
    - name: makemigrations --check
      run: python -m django makemigrations gh_permissions --check --settings=tests.settings

  pair-final-core:
    name: pair with django-trusts #211
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Matrix on exact final-core merge
      run: |
        test "${COMPANION_KERNEL_SHA}" = "8bfe6151b5a65af2d0667ab3a71680eecc90a691"
        test "$(git -C .deps/django-trusts rev-parse HEAD)" = "8bfe6151b5a65af2d0667ab3a71680eecc90a691"
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
        coverage run -m tests.runtests
        python -m django migrate --noinput --settings=tests.settings
        python -m django check --settings=tests.settings
        python -m django makemigrations gh_permissions --check --settings=tests.settings

  package:
    name: package
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e .
        python -m build
        twine check dist/*
    - name: Package metadata (README, LICENSE, BSD-2-Clause)
      run: python scripts/verify-package-metadata.py
    - name: Import wheel from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install dist/django_trusts_gh_permissions-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-install.py" --checkout "${GITHUB_WORKSPACE}"
