name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly. The pinned jobs still run only on push and pull_request.
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  # Core catalog question entries, draft django-trusts#344
  # (entries-exact-sql).
  COMPANION_KERNEL_SHA: d38a4991b46948c860b1c4f7c4e4e518a93eabca

jobs:
  tests:
    name: tests vs final core (Python ${{ matrix.python-version }})
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
      # Committed trusts-policy.lock.yaml is the MySQL 8.4 rendering.
      # This job still runs trusts.E009 and the byte comparison, against
      # a SQLite rendering at its own path.
      TRUSTS_POLICY_LOCKFILE: ${{ github.workspace }}/.ci/trusts-policy.sqlite.lock.yaml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Guard against Zero
      run: |
        test ! -e trusts/zero
        ! grep -R --include='*.py' -n 'from trusts\.zero\|import trusts\.zero\|django-trusts-zero' gh_permissions
    - name: Install final core then GH
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
    - name: Pin guard
      run: |
        if [ "${TRUSTS_FOLLOW_CORE:-}" != "1" ]; then
          python - <<'PY'
        from pathlib import Path
        pin = Path('scripts/django-trusts.pin').read_text()
        assert 'd38a4991b46948c860b1c4f7c4e4e518a93eabca' in pin, pin
        PY
        fi
        python -c "import django; assert django.VERSION[:2] == (6, 1), django.VERSION"
    - name: Render SQLite policy lock for this job
      run: |
        mkdir -p .ci
        python -m django trusts_policy_sql --lock --settings=tests.settings
    - name: Tests
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Generate Cobertura coverage.xml
      if: matrix.python-version == '3.12'
      run: coverage xml
    - name: Upload coverage to Coveralls
      if: matrix.python-version == '3.12'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml
        format: cobertura
        compare-ref: dev
    - name: Fresh migrate
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings
    - name: makemigrations --check
      run: python -m django makemigrations gh_permissions --check --settings=tests.settings

  pair-final-core:
    name: pair with django-trusts
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
      TRUSTS_POLICY_LOCKFILE: ${{ github.workspace }}/.ci/trusts-policy.sqlite.lock.yaml
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Exact companion checkout
      run: |
        if [ "${TRUSTS_FOLLOW_CORE:-}" != "1" ]; then
          test "${COMPANION_KERNEL_SHA}" = "d38a4991b46948c860b1c4f7c4e4e518a93eabca"
          test "$(git -C .deps/django-trusts rev-parse HEAD)" = "d38a4991b46948c860b1c4f7c4e4e518a93eabca"
        fi
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
        mkdir -p .ci
        python -m django trusts_policy_sql --lock --settings=tests.settings
        coverage run -m tests.runtests
        python -m django migrate --noinput --settings=tests.settings
        python -m django check --settings=tests.settings
        python -m django makemigrations gh_permissions --check --settings=tests.settings

  policy-lock-mysql:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    name: policy lock (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trusts
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
      TRUSTS_TEST_DATABASE: mysql
      TRUSTS_MYSQL_HOST: 127.0.0.1
      TRUSTS_MYSQL_PORT: "3306"
      TRUSTS_MYSQL_USER: root
      TRUSTS_MYSQL_PASSWORD: root
      TRUSTS_MYSQL_NAME: trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install final core then GH
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config default-libmysqlclient-dev
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" mysqlclient
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
    - name: Render current MySQL policy
      id: mysql-policy-lock
      run: |
        mkdir -p .ci
        TRUSTS_POLICY_LOCKFILE="${GITHUB_WORKSPACE}/.ci/trusts-policy.mysql.lock.yaml" python -m django trusts_policy_sql --lock --settings=tests.settings
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.mysql-policy-lock.outcome == 'success' }}
      with:
        name: gh-mysql-policy-lock
        path: .ci/trusts-policy.mysql.lock.yaml
    - name: Lockfile check, migrate, and migration drift
      run: |
        python - <<'PY'
        from pathlib import Path
        text = Path('trusts-policy.lock.yaml').read_text()
        if 'sql: |-' not in text:
            raise SystemExit('committed policy SQL is not a multi-line literal')
        if 'django.db.backends.mysql' not in text:
            raise SystemExit('committed policy lock is not the MySQL rendering')
        PY
        python -m django check --settings=tests.settings
        python -m django migrate --noinput --settings=tests.settings
        python -m django makemigrations gh_permissions --check --settings=tests.settings

  package:
    name: package
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e .
        python -m build
        twine check dist/*
    - name: Package metadata (README, LICENSE, BSD-2-Clause)
      run: python scripts/verify-package-metadata.py
    - name: Import wheel from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install dist/django_trusts_gh_permissions-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-install.py" --checkout "${GITHUB_WORKSPACE}"

  latest-core:
    name: latest-core
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    env:
      TRUSTS_FOLLOW_CORE: "1"
      TRUSTS_POLICY_LOCKFILE: ${{ github.workspace }}/.ci/trusts-policy.sqlite.lock.yaml
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Guard against Zero
      run: |
        test ! -e trusts/zero
        ! grep -R --include='*.py' -n 'from trusts\.zero\|import trusts\.zero\|django-trusts-zero' gh_permissions
    - name: Choose the Core ref
      run: |
        set -euo pipefail
        url="https://github.com/django-trusts/django-trusts.git"
        branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        if [ -z "${branch}" ]; then
          echo "GH branch name is empty" >&2
          exit 1
        fi
        pin="${COMPANION_KERNEL_SHA:?COMPANION_KERNEL_SHA is empty}"
        echo "GH branch: ${branch}"

        # 1. A Core branch with this GH branch's name.
        # 2. The pinned SHA, when that commit is not in Core dev yet.
        # 3. Core dev.
        heads="$(git ls-remote --heads "${url}")"
        branch_exists() {
          printf '%s\n' "${heads}" | awk -v ref="refs/heads/${1}" '$2 == ref { found = 1 } END { exit (found ? 0 : 1) }'
        }
        if branch_exists "${branch}"; then
          ref="${branch}"
          rule="Core has a branch with this name"
        else
          # Full history. A shallow fetch makes --is-ancestor wrong.
          repo="$(mktemp -d)"
          git init -q "${repo}"
          git -C "${repo}" remote add origin "${url}"
          git -C "${repo}" fetch --no-tags origin "${pin}"
          git -C "${repo}" fetch --no-tags origin "+refs/heads/dev:refs/heads/dev"
          if git -C "${repo}" merge-base --is-ancestor "${pin}" refs/heads/dev; then
            ref="dev"
            rule="pinned SHA is in Core dev"
          else
            ref="${pin}"
            rule="pinned SHA is not in Core dev"
          fi
        fi
        echo "Rule: ${rule}"
        echo "Core ref: ${ref}"
        echo "CORE_REF=${ref}" >> "${GITHUB_ENV}"
    - name: Install requirements, then current Core
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e . --config-settings editable_mode=compat --no-deps
        python -m pip install --force-reinstall --no-deps "django-trusts @ git+https://github.com/django-trusts/django-trusts.git@${CORE_REF}"
        python - <<'PY'
        import json
        from importlib.metadata import distribution
        from pathlib import Path

        root = Path(str(distribution("django-trusts").locate_file("")))
        matches = sorted(root.glob("django_trusts-*.dist-info/direct_url.json"))
        if not matches:
            raise SystemExit("installed Core has no direct_url.json")
        data = json.loads(matches[-1].read_text())
        sha = (data.get("vcs_info") or {}).get("commit_id")
        if not sha:
            raise SystemExit("installed Core has no commit id")
        print("Core SHA: %s" % sha)
        PY
    - name: Generate SQLite policy lockfile
      id: sqlite-policy-lock
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        mkdir -p .ci
        python -m django trusts_policy_sql --lock --settings=tests.settings
        python - <<'PY'
        from pathlib import Path
        text = Path(".ci/trusts-policy.sqlite.lock.yaml").read_text()
        header = text.split("backends:", 1)[0]
        if "django.db.backends.sqlite3" not in header:
            raise SystemExit("policy lock is not the SQLite rendering")
        PY

    - name: Tests
      run: python -m tests.runtests
    - name: Fresh migrate
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings
    - name: makemigrations --check
      run: python -m django makemigrations gh_permissions --check --settings=tests.settings
    - name: Upload SQLite policy lockfile
      if: ${{ !cancelled() && steps.sqlite-policy-lock.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-policy-lock
        path: .ci/trusts-policy.sqlite.lock.yaml
        retention-days: 7
        if-no-files-found: error
