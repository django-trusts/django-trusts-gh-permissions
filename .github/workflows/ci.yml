name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  # Merged core Step I (django-trusts#109 merge). Pair pin for GH IIb.
  COMPANION_KERNEL_SHA: 39f1f9611e214193aec4e97526cf9b54ee689967

jobs:
  tests:
    name: tests vs Step I (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Guard against Zero
      run: |
        test ! -e trusts/zero
        ! grep -R --include='*.py' -n 'from trusts\.zero\|import trusts\.zero\|django-trusts-zero' gh_permissions
    - name: Install Step I kernel then GH IIb
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
    - name: Pin guard
      run: |
        python - <<'PY'
        from pathlib import Path
        pin = Path('scripts/django-trusts.pin').read_text()
        assert '39f1f9611e214193aec4e97526cf9b54ee689967' in pin, pin
        PY
        python -c "import django; assert django.VERSION[:2] == (6, 1), django.VERSION"
        test "${COMPANION_KERNEL_SHA}" = "39f1f9611e214193aec4e97526cf9b54ee689967"
        test "$(git -C .deps/django-trusts rev-parse HEAD)" = "39f1f9611e214193aec4e97526cf9b54ee689967"
    - name: Tests
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Fresh migrate
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings
    - name: Fresh install + makemigrations --check
      run: python scripts/verify-fresh-install.py
    - name: Missing canonical backend path fails startup
      run: python scripts/verify-missing-backend-path.py

  pair:
    name: pair with merged core Step I
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Exact Step I pair
      run: |
        test "${COMPANION_KERNEL_SHA}" = "39f1f9611e214193aec4e97526cf9b54ee689967"
        test "$(git -C .deps/django-trusts rev-parse HEAD)" = "39f1f9611e214193aec4e97526cf9b54ee689967"
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
        coverage run -m tests.runtests
        python scripts/verify-fresh-install.py
        python scripts/verify-missing-backend-path.py

  package:
    name: package
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
        python -m build
        twine check dist/*
    - name: Import wheel from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install dist/django_trusts_gh_permissions-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-install.py" --checkout "${GITHUB_WORKSPACE}"
