name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Guard against Zero
      run: |
        test ! -e trusts/zero
        ! grep -R --include='*.py' -n 'from trusts\.zero\|import trusts\.zero\|django-trusts-zero' gh_permissions
    - name: Install Django 6.1 and pinned django-trusts
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .
    - name: Pin guard
      run: |
        python - <<'PY'
        import trusts
        from pathlib import Path
        root = Path(trusts.__file__).resolve().parents[1]
        sha = (root / '.git' / 'HEAD').read_text().strip() if (root / '.git').exists() else ''
        print('django-trusts importable from', root)
        PY
        python -c "import django; assert django.VERSION[:2] == (6, 1), django.VERSION"
    - name: Tests
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Fresh migrate
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .
        python -m build
        twine check dist/*
    - name: Import wheel from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install dist/django_trusts_gh_permissions-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python -c "import gh_permissions, gh_permissions.models, gh_permissions.policy"
