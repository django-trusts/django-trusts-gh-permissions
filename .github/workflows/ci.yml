name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Guard against Zero
      run: |
        test ! -e trusts/zero
        ! grep -R --include='*.py' -n 'from trusts\.zero\|import trusts\.zero\|django-trusts-zero' gh_permissions
    - name: Install Django 6.1 and pinned django-trusts C2
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .
    - name: Pin guard
      run: |
        python - <<'PY'
        from pathlib import Path
        pin = Path('scripts/django-trusts.pin').read_text()
        assert 'db5a41ed66478b79e10b0a066c8c0bca8fbe7882' in pin, pin
        PY
        python -c "import django; assert django.VERSION[:2] == (6, 1), django.VERSION"
    - name: Tests
      env:
        GH_SUITE: expressible
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Fresh migrate
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings

  missing-core:
    name: G1 missing-core stop
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Django 6.1 and pinned django-trusts C2
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .
    - name: Accepted team mapping (fails on current C2)
      env:
        GH_SUITE: missing-core
      run: python -m tests.runtests

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install -e .
        python -m build
        twine check dist/*
    - name: Import wheel from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install "Django>=6.1,<6.2"
        python -m pip install dist/django_trusts_gh_permissions-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-install.py" --checkout "${GITHUB_WORKSPACE}"
