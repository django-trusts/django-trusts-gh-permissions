schema_version: 1
database:
  engine: "django.db.backends.mysql"
settings:
  TRUSTS_SQL_BIND_ONCE: true
  AUTH_USER_MODEL: "example.User"
  AUTHENTICATION_BACKENDS:
    - "gh_permissions.backends.GhAuthorizationBackend"
    - "django.contrib.auth.backends.ModelBackend"
backends:
  - path: "gh_permissions.apps.GhPermissionsConfig"
    contents:
      - model: "gh_permissions.Repository"
        trusts:
          - id: "gh_permissions__RepositoryCollaborator__repository"
            name: "collaborator"
            description: "A user holds the permissions on this row for one repository."
            root: "gh_permissions.RepositoryCollaborator"
            user: {path: "user", model: "example.User", target: "id"}
            permission: {path: "permissions", model: "auth.Permission", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            or_group: true
          - id: "gh_permissions__TeamRepositoryPermission__repository__cond"
            name: "team_repository"
            description: "A team member may perform an operation on a repository in the team's organization when that operation is in the team's allowed set."
            root: "gh_permissions.TeamRepositoryPermission"
            user: {path: "team__members", model: "example.User", target: "id"}
            permission: {path: "operation", model: "auth.Permission", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in team__allowed_operations and team__organization == repository__organization"
            or_group: true
          - id: "gh_permissions__OrganizationOwnership__organization__repositories"
            name: "organization_owner_repositories"
            description: "An ownership row grants the organization owner group's permissions on that organization's repositories."
            root: "gh_permissions.OrganizationOwnership"
            user: {path: "user", model: "example.User", target: "id"}
            permission: {path: "organization__owner_group__permissions", model: "auth.Permission", target: "id"}
            content: {path: "organization__repositories", model: "gh_permissions.Repository", target: "id"}
            or_group: true
        delegations:
          - id: "gh_permissions__PersonalRepositoryDelegation__repository__cond"
            name: "personal_repository_delegation"
            description: "A delegate may use the sponsor's grants on one personal repository when this row allows the permission and that repository's organization belongs to the sponsor."
            root: "gh_permissions.PersonalRepositoryDelegation"
            delegate: {path: "delegate", model: "example.User", target: "id"}
            sponsor: {path: "sponsor", model: "example.User", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in permissions and repository__organization__personal_user == sponsor"
            or_group: true
          - id: "gh_permissions__AllPersonalRepositoriesDelegation__sponsor__personal_organization__repositories__cond"
            name: "all_personal_repositories"
            description: "A delegate may use the sponsor's grants on every repository in the sponsor's personal organization when this row allows the permission."
            root: "gh_permissions.AllPersonalRepositoriesDelegation"
            delegate: {path: "delegate", model: "example.User", target: "id"}
            sponsor: {path: "sponsor", model: "example.User", target: "id"}
            content: {path: "sponsor__personal_organization__repositories", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in permissions"
            or_group: true
          - id: "gh_permissions__RepositoryDelegation__repository__cond"
            name: "repository_delegation"
            description: "A delegate may use one sponsor's grants on a repository when this row allows the permission, the sponsor ownership is in that repository's organization, and the approved organization is that same organization."
            root: "gh_permissions.RepositoryDelegation"
            delegate: {path: "delegate", model: "example.User", target: "id"}
            sponsor: {path: "sponsor_ownership__user", model: "example.User", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in permissions and sponsor_ownership__organization == repository__organization and approved_organization == repository__organization"
            or_group: true
        permitted:
          params: ["$user.id", "$content.app_label=\"gh_permissions\"", "$content.model=\"repository\"", "skip_is_active=False", "user.is_active=True", "$permission.codename", "$permission.codename", "$permission.codename", "$permission.codename", "skip_is_active=False", "user.sponsor__is_active=True", "$permission.codename", "$permission.codename", "$permission.codename", "$permission.codename", "skip_is_active=False", "user.sponsor__is_active=True", "$permission.codename", "$permission.codename", "$permission.codename", "$permission.codename", "skip_is_active=False", "user.sponsor_ownership__user__is_active=True", "$permission.codename", "$permission.codename", "$permission.codename"]
          sql: |-
            SELECT DISTINCT `gh_permissions_repository`.`id`, `gh_permissions_repository`.`organization_id`, `gh_permissions_repository`.`name`
            FROM `gh_permissions_repository`
            CROSS JOIN (
              SELECT %s AS `user_id`, %s AS `app_label`, %s AS `model`
            ) `trusts_bind`
            WHERE (
              EXISTS (
                SELECT 1 AS `a`
                FROM `example_user` `U0`
                WHERE (`U0`.`id` = (`trusts_bind`.`user_id`)
                    AND ((%s)
                      OR (`U0`.`is_active` = %s)
                  )
                )
                LIMIT 1
              )
              AND ( EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_repositorycollaborator` `V0`
                  INNER JOIN `gh_permissions_repositorycollaborator_permissions` `V1` ON (`V0`.`id` = `V1`.`repositorycollaborator_id`)
                  INNER JOIN `auth_permission` `V2` ON (`V1`.`permission_id` = `V2`.`id`)
                  INNER JOIN `django_content_type` `V3` ON (`V2`.`content_type_id` = `V3`.`id`)
                  WHERE (`V1`.`permission_id` = (
                      SELECT `U0`.`id` AS `pk`
                      FROM `auth_permission` `U0`
                      INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                      WHERE (`U0`.`codename` = %s
                          AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U1`.`model` = (`trusts_bind`.`model`)
                      )
                      ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                      LIMIT 1
                    )
                      AND `V3`.`app_label` = (`trusts_bind`.`app_label`)
                      AND `V3`.`model` = (`trusts_bind`.`model`)
                      AND `V0`.`user_id` = (`trusts_bind`.`user_id`)
                      AND `V0`.`repository_id` = (`gh_permissions_repository`.`id`)
                  )
                  LIMIT 1
                )
                OR EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_teamrepositorypermission` `V0`
                  INNER JOIN `auth_permission` `V1` ON (`V0`.`operation_id` = `V1`.`id`)
                  INNER JOIN `django_content_type` `V2` ON (`V1`.`content_type_id` = `V2`.`id`)
                  INNER JOIN `gh_permissions_team` `V3` ON (`V0`.`team_id` = `V3`.`id`)
                  INNER JOIN `gh_permissions_team_members` `V4` ON (`V3`.`id` = `V4`.`team_id`)
                  INNER JOIN `gh_permissions_team_allowed_operations` `V6` ON (`V3`.`id` = `V6`.`team_id`)
                  WHERE (`V0`.`operation_id` = (
                      SELECT `U0`.`id` AS `pk`
                      FROM `auth_permission` `U0`
                      INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                      WHERE (`U0`.`codename` = %s
                          AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U1`.`model` = (`trusts_bind`.`model`)
                      )
                      ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                      LIMIT 1
                    )
                      AND `V2`.`app_label` = (`trusts_bind`.`app_label`)
                      AND `V2`.`model` = (`trusts_bind`.`model`)
                      AND `V4`.`user_id` = (`trusts_bind`.`user_id`)
                      AND `V6`.`permission_id` = (`V0`.`operation_id`)
                      AND (`V3`.`organization_id` = (
                        SELECT `h0`.`organization_id`
                        FROM `gh_permissions_repository` AS `h0`
                        WHERE `h0`.`id` = `V0`.`repository_id`
                      )
                    )
                      AND `V0`.`repository_id` = (`gh_permissions_repository`.`id`)
                  )
                  LIMIT 1
                )
                OR EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_organizationownership` `V0`
                  INNER JOIN `gh_permissions_organization` `V1` ON (`V0`.`organization_id` = `V1`.`id`)
                  INNER JOIN `auth_group` `V2` ON (`V1`.`owner_group_id` = `V2`.`id`)
                  INNER JOIN `auth_group_permissions` `V3` ON (`V2`.`id` = `V3`.`group_id`)
                  INNER JOIN `auth_permission` `V4` ON (`V3`.`permission_id` = `V4`.`id`)
                  INNER JOIN `django_content_type` `V5` ON (`V4`.`content_type_id` = `V5`.`id`)
                  INNER JOIN `gh_permissions_repository` `V7` ON (`V1`.`id` = `V7`.`organization_id`)
                  WHERE (`V3`.`permission_id` = (
                      SELECT `U0`.`id` AS `pk`
                      FROM `auth_permission` `U0`
                      INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                      WHERE (`U0`.`codename` = %s
                          AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U1`.`model` = (`trusts_bind`.`model`)
                      )
                      ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                      LIMIT 1
                    )
                      AND `V5`.`app_label` = (`trusts_bind`.`app_label`)
                      AND `V5`.`model` = (`trusts_bind`.`model`)
                      AND `V0`.`user_id` = (`trusts_bind`.`user_id`)
                      AND `V7`.`id` = (`gh_permissions_repository`.`id`)
                  )
                  LIMIT 1
                )
                OR EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_personalrepositorydelegation` `W0`
                  INNER JOIN `gh_permissions_personalrepositorydelegation_permissions` `W3` ON (`W0`.`id` = `W3`.`personalrepositorydelegation_id`)
                  WHERE (`W0`.`delegate_id` = (`trusts_bind`.`user_id`)
                      AND `W0`.`repository_id` = (`gh_permissions_repository`.`id`)
                      AND `W3`.`permission_id` = (
                      SELECT `U0`.`id` AS `pk`
                      FROM `auth_permission` `U0`
                      INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                      WHERE (`U0`.`codename` = %s
                          AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U1`.`model` = (`trusts_bind`.`model`)
                      )
                      ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                      LIMIT 1
                    )
                      AND ((
                        SELECT `h1`.`personal_user_id`
                        FROM `gh_permissions_repository` AS `h0`
                        JOIN `gh_permissions_organization` AS `h1` ON `h1`.`id` = `h0`.`organization_id`
                        WHERE `h0`.`id` = `W0`.`repository_id`
                      ) = `W0`.`sponsor_id`
                    )
                      AND ((%s)
                        OR ((
                          SELECT `h0`.`is_active`
                          FROM `example_user` AS `h0`
                          WHERE `h0`.`id` = `W0`.`sponsor_id`
                        ) = %s
                      )
                    )
                      AND ( EXISTS (
                        SELECT 1 AS `a`
                        FROM `gh_permissions_repositorycollaborator` `V0`
                        INNER JOIN `gh_permissions_repositorycollaborator_permissions` `V1` ON (`V0`.`id` = `V1`.`repositorycollaborator_id`)
                        INNER JOIN `auth_permission` `V2` ON (`V1`.`permission_id` = `V2`.`id`)
                        INNER JOIN `django_content_type` `V3` ON (`V2`.`content_type_id` = `V3`.`id`)
                        WHERE (`V1`.`permission_id` = (
                            SELECT `U0`.`id` AS `pk`
                            FROM `auth_permission` `U0`
                            INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                            WHERE (`U0`.`codename` = %s
                                AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                                AND `U1`.`model` = (`trusts_bind`.`model`)
                            )
                            ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                            LIMIT 1
                          )
                            AND `V3`.`app_label` = (`trusts_bind`.`app_label`)
                            AND `V3`.`model` = (`trusts_bind`.`model`)
                            AND `V0`.`repository_id` = (`W0`.`repository_id`)
                            AND `V0`.`user_id` = (`W0`.`sponsor_id`)
                        )
                        LIMIT 1
                      )
                      OR EXISTS (
                        SELECT 1 AS `a`
                        FROM `gh_permissions_teamrepositorypermission` `V0`
                        INNER JOIN `auth_permission` `V1` ON (`V0`.`operation_id` = `V1`.`id`)
                        INNER JOIN `django_content_type` `V2` ON (`V1`.`content_type_id` = `V2`.`id`)
                        INNER JOIN `gh_permissions_team` `V4` ON (`V0`.`team_id` = `V4`.`id`)
                        INNER JOIN `gh_permissions_team_members` `V5` ON (`V4`.`id` = `V5`.`team_id`)
                        INNER JOIN `gh_permissions_team_allowed_operations` `V7` ON (`V4`.`id` = `V7`.`team_id`)
                        WHERE (`V0`.`operation_id` = (
                            SELECT `U0`.`id` AS `pk`
                            FROM `auth_permission` `U0`
                            INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                            WHERE (`U0`.`codename` = %s
                                AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                                AND `U1`.`model` = (`trusts_bind`.`model`)
                            )
                            ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                            LIMIT 1
                          )
                            AND `V2`.`app_label` = (`trusts_bind`.`app_label`)
                            AND `V2`.`model` = (`trusts_bind`.`model`)
                            AND `V0`.`repository_id` = (`W0`.`repository_id`)
                            AND `V5`.`user_id` = (`W0`.`sponsor_id`)
                            AND `V7`.`permission_id` = (`V0`.`operation_id`)
                            AND (`V4`.`organization_id` = (
                              SELECT `h0`.`organization_id`
                              FROM `gh_permissions_repository` AS `h0`
                              WHERE `h0`.`id` = `V0`.`repository_id`
                            )
                          )
                        )
                        LIMIT 1
                      )
                      OR EXISTS (
                        SELECT 1 AS `a`
                        FROM `gh_permissions_organizationownership` `V0`
                        INNER JOIN `gh_permissions_organization` `V1` ON (`V0`.`organization_id` = `V1`.`id`)
                        INNER JOIN `auth_group` `V2` ON (`V1`.`owner_group_id` = `V2`.`id`)
                        INNER JOIN `auth_group_permissions` `V3` ON (`V2`.`id` = `V3`.`group_id`)
                        INNER JOIN `auth_permission` `V4` ON (`V3`.`permission_id` = `V4`.`id`)
                        INNER JOIN `django_content_type` `V5` ON (`V4`.`content_type_id` = `V5`.`id`)
                        INNER JOIN `gh_permissions_repository` `V6` ON (`V1`.`id` = `V6`.`organization_id`)
                        WHERE (`V3`.`permission_id` = (
                            SELECT `U0`.`id` AS `pk`
                            FROM `auth_permission` `U0`
                            INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                            WHERE (`U0`.`codename` = %s
                                AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                                AND `U1`.`model` = (`trusts_bind`.`model`)
                            )
                            ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                            LIMIT 1
                          )
                            AND `V5`.`app_label` = (`trusts_bind`.`app_label`)
                            AND `V5`.`model` = (`trusts_bind`.`model`)
                            AND `V6`.`id` = (`W0`.`repository_id`)
                            AND `V0`.`user_id` = (`W0`.`sponsor_id`)
                        )
                        LIMIT 1
                      ) ) )
                  LIMIT 1
                )
                OR EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_allpersonalrepositoriesdelegation` `W0`
                  INNER JOIN `example_user` `W2` ON (`W0`.`sponsor_id` = `W2`.`id`)
                  INNER JOIN `gh_permissions_organization` `W3` ON (`W2`.`id` = `W3`.`personal_user_id`)
                  INNER JOIN `gh_permissions_repository` `W4` ON (`W3`.`id` = `W4`.`organization_id`)
                  INNER JOIN `gh_permissions_allpersonalrepositoriesdelegation_permissions` `W5` ON (`W0`.`id` = `W5`.`allpersonalrepositoriesdelegation_id`)
                  WHERE (`W0`.`delegate_id` = (`trusts_bind`.`user_id`)
                      AND `W4`.`id` = (`gh_permissions_repository`.`id`)
                      AND `W5`.`permission_id` = (
                      SELECT `U0`.`id` AS `pk`
                      FROM `auth_permission` `U0`
                      INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                      WHERE (`U0`.`codename` = %s
                          AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U1`.`model` = (`trusts_bind`.`model`)
                      )
                      ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                      LIMIT 1
                    )
                      AND ((%s)
                        OR (`W2`.`is_active` = %s)
                    )
                      AND ( EXISTS (
                        SELECT 1 AS `a`
                        FROM `gh_permissions_repositorycollaborator` `V0`
                        INNER JOIN `gh_permissions_repositorycollaborator_permissions` `V1` ON (`V0`.`id` = `V1`.`repositorycollaborator_id`)
                        INNER JOIN `auth_permission` `V2` ON (`V1`.`permission_id` = `V2`.`id`)
                        INNER JOIN `django_content_type` `V3` ON (`V2`.`content_type_id` = `V3`.`id`)
                        WHERE (`V1`.`permission_id` = (
                            SELECT `U0`.`id` AS `pk`
                            FROM `auth_permission` `U0`
                            INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                            WHERE (`U0`.`codename` = %s
                                AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                                AND `U1`.`model` = (`trusts_bind`.`model`)
                            )
                            ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                            LIMIT 1
                          )
                            AND `V3`.`app_label` = (`trusts_bind`.`app_label`)
                            AND `V3`.`model` = (`trusts_bind`.`model`)
                            AND `V0`.`repository_id` = (`W4`.`id`)
                            AND `V0`.`user_id` = (`W0`.`sponsor_id`)
                        )
                        LIMIT 1
                      )
                      OR EXISTS (
                        SELECT 1 AS `a`
                        FROM `gh_permissions_teamrepositorypermission` `V0`
                        INNER JOIN `auth_permission` `V1` ON (`V0`.`operation_id` = `V1`.`id`)
                        INNER JOIN `django_content_type` `V2` ON (`V1`.`content_type_id` = `V2`.`id`)
                        INNER JOIN `gh_permissions_team` `V4` ON (`V0`.`team_id` = `V4`.`id`)
                        INNER JOIN `gh_permissions_team_members` `V5` ON (`V4`.`id` = `V5`.`team_id`)
                        INNER JOIN `gh_permissions_team_allowed_operations` `V7` ON (`V4`.`id` = `V7`.`team_id`)
                        WHERE (`V0`.`operation_id` = (
                            SELECT `U0`.`id` AS `pk`
                            FROM `auth_permission` `U0`
                            INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                            WHERE (`U0`.`codename` = %s
                                AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                                AND `U1`.`model` = (`trusts_bind`.`model`)
                            )
                            ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                            LIMIT 1
                          )
                            AND `V2`.`app_label` = (`trusts_bind`.`app_label`)
                            AND `V2`.`model` = (`trusts_bind`.`model`)
                            AND `V0`.`repository_id` = (`W4`.`id`)
                            AND `V5`.`user_id` = (`W0`.`sponsor_id`)
                            AND `V7`.`permission_id` = (`V0`.`operation_id`)
                            AND (`V4`.`organization_id` = (
                              SELECT `h0`.`organization_id`
                              FROM `gh_permissions_repository` AS `h0`
                              WHERE `h0`.`id` = `V0`.`repository_id`
                            )
                          )
                        )
                        LIMIT 1
                      )
                      OR EXISTS (
                        SELECT 1 AS `a`
                        FROM `gh_permissions_organizationownership` `V0`
                        INNER JOIN `gh_permissions_organization` `V1` ON (`V0`.`organization_id` = `V1`.`id`)
                        INNER JOIN `auth_group` `V2` ON (`V1`.`owner_group_id` = `V2`.`id`)
                        INNER JOIN `auth_group_permissions` `V3` ON (`V2`.`id` = `V3`.`group_id`)
                        INNER JOIN `auth_permission` `V4` ON (`V3`.`permission_id` = `V4`.`id`)
                        INNER JOIN `django_content_type` `V5` ON (`V4`.`content_type_id` = `V5`.`id`)
                        INNER JOIN `gh_permissions_repository` `V6` ON (`V1`.`id` = `V6`.`organization_id`)
                        WHERE (`V3`.`permission_id` = (
                            SELECT `U0`.`id` AS `pk`
                            FROM `auth_permission` `U0`
                            INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                            WHERE (`U0`.`codename` = %s
                                AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                                AND `U1`.`model` = (`trusts_bind`.`model`)
                            )
                            ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                            LIMIT 1
                          )
                            AND `V5`.`app_label` = (`trusts_bind`.`app_label`)
                            AND `V5`.`model` = (`trusts_bind`.`model`)
                            AND `V6`.`id` = (`W4`.`id`)
                            AND `V0`.`user_id` = (`W0`.`sponsor_id`)
                        )
                        LIMIT 1
                      ) ) )
                  LIMIT 1
                )
                OR EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_repositorydelegation` `W0`
                  INNER JOIN `gh_permissions_repositorydelegation_permissions` `W3` ON (`W0`.`id` = `W3`.`repositorydelegation_id`)
                  INNER JOIN `gh_permissions_organizationownership` `W5` ON (`W0`.`sponsor_ownership_id` = `W5`.`id`)
                  WHERE (`W0`.`delegate_id` = (`trusts_bind`.`user_id`)
                      AND `W0`.`repository_id` = (`gh_permissions_repository`.`id`)
                      AND `W3`.`permission_id` = (
                      SELECT `U0`.`id` AS `pk`
                      FROM `auth_permission` `U0`
                      INNER JOIN `django_content_type` `U1` ON (`U0`.`content_type_id` = `U1`.`id`)
                      WHERE (`U0`.`codename` = %s
                          AND `U1`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U1`.`model` = (`trusts_bind`.`model`)
                      )
                      ORDER BY `U1`.`app_label` ASC, `U1`.`model` ASC, `U0`.`codename` ASC
                      LIMIT 1
                    )
                      AND (`W5`.`organization_id` = (
                        SELECT `h0`.`organization_id`
                        FROM `gh_permissions_repository` AS `h0`
                        WHERE `h0`.`id` = `W0`.`repository_id`
                      )
                    )
                      AND (`W0`.`approved_organization_id` = (
                        SELECT `h0`.`organization_id`
                        FROM `gh_permissions_repository` AS `h0`
                        WHERE `h0`.`id` = `W0`.`repository_id`
                      )
                    )
                      AND ((%s)
                        OR ((
                          SELECT `h0`.`is_active`
                          FROM `example_user` AS `h0`
                          WHERE `h0`.`id` = `W5`.`user_id`
                        ) = %s
                      )
                    )
