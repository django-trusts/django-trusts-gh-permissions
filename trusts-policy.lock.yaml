schema_version: 1
database:
  engine: "django.db.backends.mysql"
backends:
  - path: "gh_permissions.backends.GhAuthorizationBackend"
    contents:
      - model: "gh_permissions.Repository"
        trusts:
          - id: "gh_permissions__RepositoryCollaborator__repository"
            root: "gh_permissions.RepositoryCollaborator"
            user: {path: "user", model: "example.User", target: "id"}
            permission: {path: "permissions", model: "auth.Permission", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            or_group: true
          - id: "gh_permissions__TeamRepositoryPermission__repository__cond"
            root: "gh_permissions.TeamRepositoryPermission"
            user: {path: "team__members", model: "example.User", target: "id"}
            permission: {path: "operation", model: "auth.Permission", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in team__allowed_operations and team__organization == repository__organization"
            or_group: true
          - id: "gh_permissions__OrganizationOwnership__organization__repositories"
            root: "gh_permissions.OrganizationOwnership"
            user: {path: "user", model: "example.User", target: "id"}
            permission: {path: "organization__owner_group__permissions", model: "auth.Permission", target: "id"}
            content: {path: "organization__repositories", model: "gh_permissions.Repository", target: "id"}
            or_group: true
        delegations:
          - id: "gh_permissions__PersonalRepositoryDelegation__repository__cond"
            root: "gh_permissions.PersonalRepositoryDelegation"
            delegate: {path: "delegate", model: "example.User", target: "id"}
            sponsor: {path: "sponsor", model: "example.User", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in permissions and repository__organization__personal_user == sponsor"
            or_group: true
          - id: "gh_permissions__AllPersonalRepositoriesDelegation__sponsor__personal_organization__repositories__cond"
            root: "gh_permissions.AllPersonalRepositoriesDelegation"
            delegate: {path: "delegate", model: "example.User", target: "id"}
            sponsor: {path: "sponsor", model: "example.User", target: "id"}
            content: {path: "sponsor__personal_organization__repositories", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in permissions"
            or_group: true
          - id: "gh_permissions__RepositoryDelegation__repository__cond"
            root: "gh_permissions.RepositoryDelegation"
            delegate: {path: "delegate", model: "example.User", target: "id"}
            sponsor: {path: "sponsor_ownership__user", model: "example.User", target: "id"}
            content: {path: "repository", model: "gh_permissions.Repository", target: "id"}
            condition: "$permission.id in permissions and sponsor_ownership__organization == repository__organization and approved_organization == repository__organization"
            or_group: true
        permitted:
          params: ["$user.id", "$permission.id", "$content.app_label=\"gh_permissions\"", "$content.model=\"repository\"", "user.is_active=True"]
          sql: |-
            SELECT DISTINCT `gh_permissions_repository`.`id`, `gh_permissions_repository`.`organization_id`, `gh_permissions_repository`.`name`
            FROM `gh_permissions_repository`
            CROSS JOIN (
              SELECT %s AS `user_id`, %s AS `permission_id`, %s AS `app_label`, %s AS `model`, %s AS `is_active`
            ) `trusts_bind`
            WHERE (
              EXISTS (
                SELECT 1 AS `a`
                FROM `gh_permissions_repositorycollaborator` `U0`
                INNER JOIN `gh_permissions_repositorycollaborator_permissions` `U1` ON (`U0`.`id` = `U1`.`repositorycollaborator_id`)
                INNER JOIN `auth_permission` `U2` ON (`U1`.`permission_id` = `U2`.`id`)
                INNER JOIN `django_content_type` `U3` ON (`U2`.`content_type_id` = `U3`.`id`)
                WHERE (`U1`.`permission_id` = (`trusts_bind`.`permission_id`)
                    AND `U3`.`app_label` = (`trusts_bind`.`app_label`)
                    AND `U3`.`model` = (`trusts_bind`.`model`)
                    AND `U0`.`user_id` = (`trusts_bind`.`user_id`)
                    AND `U0`.`repository_id` = (`gh_permissions_repository`.`id`)
                )
                LIMIT 1
              )
              OR EXISTS (
                SELECT 1 AS `a`
                FROM `gh_permissions_teamrepositorypermission` `U0`
                INNER JOIN `auth_permission` `U1` ON (`U0`.`operation_id` = `U1`.`id`)
                INNER JOIN `django_content_type` `U2` ON (`U1`.`content_type_id` = `U2`.`id`)
                INNER JOIN `gh_permissions_team` `U3` ON (`U0`.`team_id` = `U3`.`id`)
                INNER JOIN `gh_permissions_team_members` `U4` ON (`U3`.`id` = `U4`.`team_id`)
                INNER JOIN `gh_permissions_team_allowed_operations` `U6` ON (`U3`.`id` = `U6`.`team_id`)
                INNER JOIN `gh_permissions_repository` `U8` ON (`U0`.`repository_id` = `U8`.`id`)
                WHERE (`U0`.`operation_id` = (`trusts_bind`.`permission_id`)
                    AND `U2`.`app_label` = (`trusts_bind`.`app_label`)
                    AND `U2`.`model` = (`trusts_bind`.`model`)
                    AND `U4`.`user_id` = (`trusts_bind`.`user_id`)
                    AND `U6`.`permission_id` = (`U0`.`operation_id`)
                    AND `U3`.`organization_id` = (`U8`.`organization_id`)
                    AND `U0`.`repository_id` = (`gh_permissions_repository`.`id`)
                )
                LIMIT 1
              )
              OR EXISTS (
                SELECT 1 AS `a`
                FROM `gh_permissions_organizationownership` `U0`
                INNER JOIN `gh_permissions_organization` `U1` ON (`U0`.`organization_id` = `U1`.`id`)
                INNER JOIN `auth_group` `U2` ON (`U1`.`owner_group_id` = `U2`.`id`)
                INNER JOIN `auth_group_permissions` `U3` ON (`U2`.`id` = `U3`.`group_id`)
                INNER JOIN `auth_permission` `U4` ON (`U3`.`permission_id` = `U4`.`id`)
                INNER JOIN `django_content_type` `U5` ON (`U4`.`content_type_id` = `U5`.`id`)
                INNER JOIN `gh_permissions_repository` `U7` ON (`U1`.`id` = `U7`.`organization_id`)
                WHERE (`U3`.`permission_id` = (`trusts_bind`.`permission_id`)
                    AND `U5`.`app_label` = (`trusts_bind`.`app_label`)
                    AND `U5`.`model` = (`trusts_bind`.`model`)
                    AND `U0`.`user_id` = (`trusts_bind`.`user_id`)
                    AND `U7`.`id` = (`gh_permissions_repository`.`id`)
                )
                LIMIT 1
              )
              OR EXISTS (
                SELECT 1 AS `a`
                FROM `gh_permissions_personalrepositorydelegation` `V0`
                INNER JOIN `gh_permissions_repository` `V2` ON (`V0`.`repository_id` = `V2`.`id`)
                INNER JOIN `gh_permissions_personalrepositorydelegation_permissions` `V3` ON (`V0`.`id` = `V3`.`personalrepositorydelegation_id`)
                INNER JOIN `example_user` `V5` ON (`V0`.`sponsor_id` = `V5`.`id`)
                INNER JOIN `gh_permissions_organization` `V6` ON (`V2`.`organization_id` = `V6`.`id`)
                WHERE (`V0`.`delegate_id` = (`trusts_bind`.`user_id`)
                    AND `V0`.`repository_id` = (`gh_permissions_repository`.`id`)
                    AND `V3`.`permission_id` = (`trusts_bind`.`permission_id`)
                    AND `V6`.`personal_user_id` = (`V0`.`sponsor_id`)
                    AND `V5`.`is_active` = (`trusts_bind`.`is_active`)
                    AND ( EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_repositorycollaborator` `U0`
                      INNER JOIN `gh_permissions_repositorycollaborator_permissions` `U1` ON (`U0`.`id` = `U1`.`repositorycollaborator_id`)
                      INNER JOIN `auth_permission` `U2` ON (`U1`.`permission_id` = `U2`.`id`)
                      INNER JOIN `django_content_type` `U3` ON (`U2`.`content_type_id` = `U3`.`id`)
                      WHERE (`U1`.`permission_id` = (`trusts_bind`.`permission_id`)
                          AND `U3`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U3`.`model` = (`trusts_bind`.`model`)
                          AND `U0`.`repository_id` = (`V0`.`repository_id`)
                          AND `U0`.`user_id` = (`V0`.`sponsor_id`)
                      )
                      LIMIT 1
                    )
                    OR EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_teamrepositorypermission` `U0`
                      INNER JOIN `auth_permission` `U1` ON (`U0`.`operation_id` = `U1`.`id`)
                      INNER JOIN `django_content_type` `U2` ON (`U1`.`content_type_id` = `U2`.`id`)
                      INNER JOIN `gh_permissions_repository` `U3` ON (`U0`.`repository_id` = `U3`.`id`)
                      INNER JOIN `gh_permissions_team` `U4` ON (`U0`.`team_id` = `U4`.`id`)
                      INNER JOIN `gh_permissions_team_members` `U5` ON (`U4`.`id` = `U5`.`team_id`)
                      INNER JOIN `gh_permissions_team_allowed_operations` `U7` ON (`U4`.`id` = `U7`.`team_id`)
                      WHERE (`U0`.`operation_id` = (`trusts_bind`.`permission_id`)
                          AND `U2`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U2`.`model` = (`trusts_bind`.`model`)
                          AND `U0`.`repository_id` = (`V0`.`repository_id`)
                          AND `U5`.`user_id` = (`V0`.`sponsor_id`)
                          AND `U7`.`permission_id` = (`U0`.`operation_id`)
                          AND `U4`.`organization_id` = (`U3`.`organization_id`)
                      )
                      LIMIT 1
                    )
                    OR EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_organizationownership` `U0`
                      INNER JOIN `gh_permissions_organization` `U1` ON (`U0`.`organization_id` = `U1`.`id`)
                      INNER JOIN `auth_group` `U2` ON (`U1`.`owner_group_id` = `U2`.`id`)
                      INNER JOIN `auth_group_permissions` `U3` ON (`U2`.`id` = `U3`.`group_id`)
                      INNER JOIN `auth_permission` `U4` ON (`U3`.`permission_id` = `U4`.`id`)
                      INNER JOIN `django_content_type` `U5` ON (`U4`.`content_type_id` = `U5`.`id`)
                      INNER JOIN `gh_permissions_repository` `U6` ON (`U1`.`id` = `U6`.`organization_id`)
                      WHERE (`U3`.`permission_id` = (`trusts_bind`.`permission_id`)
                          AND `U5`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U5`.`model` = (`trusts_bind`.`model`)
                          AND `U6`.`id` = (`V0`.`repository_id`)
                          AND `U0`.`user_id` = (`V0`.`sponsor_id`)
                      )
                      LIMIT 1
                    ) ) )
                LIMIT 1
              )
              OR EXISTS (
                SELECT 1 AS `a`
                FROM `gh_permissions_allpersonalrepositoriesdelegation` `V0`
                INNER JOIN `example_user` `V2` ON (`V0`.`sponsor_id` = `V2`.`id`)
                INNER JOIN `gh_permissions_organization` `V3` ON (`V2`.`id` = `V3`.`personal_user_id`)
                INNER JOIN `gh_permissions_repository` `V4` ON (`V3`.`id` = `V4`.`organization_id`)
                INNER JOIN `gh_permissions_allpersonalrepositoriesdelegation_permissions` `V5` ON (`V0`.`id` = `V5`.`allpersonalrepositoriesdelegation_id`)
                WHERE (`V0`.`delegate_id` = (`trusts_bind`.`user_id`)
                    AND `V4`.`id` = (`gh_permissions_repository`.`id`)
                    AND `V5`.`permission_id` = (`trusts_bind`.`permission_id`)
                    AND `V2`.`is_active` = (`trusts_bind`.`is_active`)
                    AND ( EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_repositorycollaborator` `U0`
                      INNER JOIN `gh_permissions_repositorycollaborator_permissions` `U1` ON (`U0`.`id` = `U1`.`repositorycollaborator_id`)
                      INNER JOIN `auth_permission` `U2` ON (`U1`.`permission_id` = `U2`.`id`)
                      INNER JOIN `django_content_type` `U3` ON (`U2`.`content_type_id` = `U3`.`id`)
                      WHERE (`U1`.`permission_id` = (`trusts_bind`.`permission_id`)
                          AND `U3`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U3`.`model` = (`trusts_bind`.`model`)
                          AND `U0`.`repository_id` = (`V4`.`id`)
                          AND `U0`.`user_id` = (`V0`.`sponsor_id`)
                      )
                      LIMIT 1
                    )
                    OR EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_teamrepositorypermission` `U0`
                      INNER JOIN `auth_permission` `U1` ON (`U0`.`operation_id` = `U1`.`id`)
                      INNER JOIN `django_content_type` `U2` ON (`U1`.`content_type_id` = `U2`.`id`)
                      INNER JOIN `gh_permissions_repository` `U3` ON (`U0`.`repository_id` = `U3`.`id`)
                      INNER JOIN `gh_permissions_team` `U4` ON (`U0`.`team_id` = `U4`.`id`)
                      INNER JOIN `gh_permissions_team_members` `U5` ON (`U4`.`id` = `U5`.`team_id`)
                      INNER JOIN `gh_permissions_team_allowed_operations` `U7` ON (`U4`.`id` = `U7`.`team_id`)
                      WHERE (`U0`.`operation_id` = (`trusts_bind`.`permission_id`)
                          AND `U2`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U2`.`model` = (`trusts_bind`.`model`)
                          AND `U0`.`repository_id` = (`V4`.`id`)
                          AND `U5`.`user_id` = (`V0`.`sponsor_id`)
                          AND `U7`.`permission_id` = (`U0`.`operation_id`)
                          AND `U4`.`organization_id` = (`U3`.`organization_id`)
                      )
                      LIMIT 1
                    )
                    OR EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_organizationownership` `U0`
                      INNER JOIN `gh_permissions_organization` `U1` ON (`U0`.`organization_id` = `U1`.`id`)
                      INNER JOIN `auth_group` `U2` ON (`U1`.`owner_group_id` = `U2`.`id`)
                      INNER JOIN `auth_group_permissions` `U3` ON (`U2`.`id` = `U3`.`group_id`)
                      INNER JOIN `auth_permission` `U4` ON (`U3`.`permission_id` = `U4`.`id`)
                      INNER JOIN `django_content_type` `U5` ON (`U4`.`content_type_id` = `U5`.`id`)
                      INNER JOIN `gh_permissions_repository` `U6` ON (`U1`.`id` = `U6`.`organization_id`)
                      WHERE (`U3`.`permission_id` = (`trusts_bind`.`permission_id`)
                          AND `U5`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U5`.`model` = (`trusts_bind`.`model`)
                          AND `U6`.`id` = (`V4`.`id`)
                          AND `U0`.`user_id` = (`V0`.`sponsor_id`)
                      )
                      LIMIT 1
                    ) ) )
                LIMIT 1
              )
              OR EXISTS (
                SELECT 1 AS `a`
                FROM `gh_permissions_repositorydelegation` `V0`
                INNER JOIN `gh_permissions_repository` `V2` ON (`V0`.`repository_id` = `V2`.`id`)
                INNER JOIN `gh_permissions_repositorydelegation_permissions` `V3` ON (`V0`.`id` = `V3`.`repositorydelegation_id`)
                INNER JOIN `gh_permissions_organizationownership` `V6` ON (`V0`.`sponsor_ownership_id` = `V6`.`id`)
                INNER JOIN `example_user` `V9` ON (`V6`.`user_id` = `V9`.`id`)
                WHERE (`V0`.`delegate_id` = (`trusts_bind`.`user_id`)
                    AND `V0`.`repository_id` = (`gh_permissions_repository`.`id`)
                    AND `V3`.`permission_id` = (`trusts_bind`.`permission_id`)
                    AND `V6`.`organization_id` = (`V2`.`organization_id`)
                    AND `V0`.`approved_organization_id` = (`V2`.`organization_id`)
                    AND `V9`.`is_active` = (`trusts_bind`.`is_active`)
                    AND ( EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_repositorycollaborator` `U0`
                      INNER JOIN `gh_permissions_repositorycollaborator_permissions` `U1` ON (`U0`.`id` = `U1`.`repositorycollaborator_id`)
                      INNER JOIN `auth_permission` `U2` ON (`U1`.`permission_id` = `U2`.`id`)
                      INNER JOIN `django_content_type` `U3` ON (`U2`.`content_type_id` = `U3`.`id`)
                      WHERE (`U1`.`permission_id` = (`trusts_bind`.`permission_id`)
                          AND `U3`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U3`.`model` = (`trusts_bind`.`model`)
                          AND `U0`.`repository_id` = (`V0`.`repository_id`)
                          AND `U0`.`user_id` = (`V6`.`user_id`)
                      )
                      LIMIT 1
                    )
                    OR EXISTS (
                      SELECT 1 AS `a`
                      FROM `gh_permissions_teamrepositorypermission` `U0`
                      INNER JOIN `auth_permission` `U1` ON (`U0`.`operation_id` = `U1`.`id`)
                      INNER JOIN `django_content_type` `U2` ON (`U1`.`content_type_id` = `U2`.`id`)
                      INNER JOIN `gh_permissions_repository` `U3` ON (`U0`.`repository_id` = `U3`.`id`)
                      INNER JOIN `gh_permissions_team` `U4` ON (`U0`.`team_id` = `U4`.`id`)
                      INNER JOIN `gh_permissions_team_members` `U5` ON (`U4`.`id` = `U5`.`team_id`)
                      INNER JOIN `gh_permissions_team_allowed_operations` `U7` ON (`U4`.`id` = `U7`.`team_id`)
                      WHERE (`U0`.`operation_id` = (`trusts_bind`.`permission_id`)
                          AND `U2`.`app_label` = (`trusts_bind`.`app_label`)
                          AND `U2`.`model` = (`trusts_bind`.`model`)
                          AND `U0`.`repository_id` = (`V0`.`repository_id`)
                          AND `U5`.`user_id` = (`V6`.`user_id`)
