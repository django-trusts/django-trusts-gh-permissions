                  INNER JOIN `gh_permissions_team_allowed_operations` `U6` ON (`U3`.`id` = `U6`.`team_id`)
                  INNER JOIN `gh_permissions_repository` `U8` ON (`U0`.`repository_id` = `U8`.`id`)
                  WHERE (`U0`.`operation_id` = (`trusts_bind`.`permission_id`)
                      AND `U2`.`app_label` = (`trusts_bind`.`app_label`)
                      AND `U2`.`model` = (`trusts_bind`.`model`)
                      AND `U4`.`user_id` = (`trusts_bind`.`user_id`)
                      AND `U6`.`permission_id` = (`U0`.`operation_id`)
                      AND `U3`.`organization_id` = (`U8`.`organization_id`)
                      AND `U0`.`repository_id` = (`gh_permissions_repository`.`id`)
                  )
                  LIMIT 1
                )
                OR EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_organizationownership` `U0`
                  INNER JOIN `gh_permissions_organization` `U1` ON (`U0`.`organization_id` = `U1`.`id`)
                  INNER JOIN `auth_group` `U2` ON (`U1`.`owner_group_id` = `U2`.`id`)
                  INNER JOIN `auth_group_permissions` `U3` ON (`U2`.`id` = `U3`.`group_id`)
                  INNER JOIN `auth_permission` `U4` ON (`U3`.`permission_id` = `U4`.`id`)
                  INNER JOIN `django_content_type` `U5` ON (`U4`.`content_type_id` = `U5`.`id`)
                  INNER JOIN `gh_permissions_repository` `U7` ON (`U1`.`id` = `U7`.`organization_id`)
                  WHERE (`U3`.`permission_id` = (`trusts_bind`.`permission_id`)
                      AND `U5`.`app_label` = (`trusts_bind`.`app_label`)
                      AND `U5`.`model` = (`trusts_bind`.`model`)
                      AND `U0`.`user_id` = (`trusts_bind`.`user_id`)
                      AND `U7`.`id` = (`gh_permissions_repository`.`id`)
                  )
                  LIMIT 1
                )
                OR EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_personalrepositorydelegation` `V0`
                  INNER JOIN `gh_permissions_repository` `V2` ON (`V0`.`repository_id` = `V2`.`id`)
                  INNER JOIN `gh_permissions_personalrepositorydelegation_permissions` `V3` ON (`V0`.`id` = `V3`.`personalrepositorydelegation_id`)
                  INNER JOIN `example_user` `V5` ON (`V0`.`sponsor_id` = `V5`.`id`)
                  INNER JOIN `gh_permissions_organization` `V6` ON (`V2`.`organization_id` = `V6`.`id`)
                  WHERE (`V0`.`delegate_id` = (`trusts_bind`.`user_id`)
                      AND `V0`.`repository_id` = (`gh_permissions_repository`.`id`)
                      AND `V3`.`permission_id` = (`trusts_bind`.`permission_id`)
                      AND `V6`.`personal_user_id` = (`V0`.`sponsor_id`)
                      AND `V5`.`is_active` = (`trusts_bind`.`is_active`)
                      AND ( EXISTS (
