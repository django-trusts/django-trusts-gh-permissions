        has_perm:
          params: ["$user.id", "$permission.id", "$content.id", "$content.app_label=\"gh_permissions\"", "$content.model=\"repository\"", "user.is_active=True"]
          sql: |-
            SELECT 1 AS `a`
            FROM `gh_permissions_repository`
            CROSS JOIN (
              SELECT %s AS `user_id`, %s AS `permission_id`, %s AS `content_pk`, %s AS `app_label`, %s AS `model`, %s AS `is_active`
            ) `trusts_bind`
            WHERE (`gh_permissions_repository`.`id` = (`trusts_bind`.`content_pk`)
                AND ( EXISTS (
                  SELECT 1 AS `a`
                  FROM `gh_permissions_repositorycollaborator` `U0`
                  INNER JOIN `gh_permissions_repositorycollaborator_permissions` `U1` ON (`U0`.`id` = `U1`.`repositorycollaborator_id`)
                  INNER JOIN `auth_permission` `U2` ON (`U1`.`permission_id` = `U2`.`id`)
                  INNER JOIN `django_content_type` `U3` ON (`U2`.`content_type_id` = `U3`.`id`)
